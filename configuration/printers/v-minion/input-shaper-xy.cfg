# sections into your printer.cfg and change it there.

[include ../../boards/rpi/config.cfg]
[include ../../sensors/rpi-adxl345.cfg]

[resonance_tester]
# RatOS-Kalico: Kalico defaults sweeping_period to 0.0, which silently turns
# the sweep into plain vibration pulses. Klipper's default is 1.2;
# pin it so shaper results stay comparable with RatOS on Klipper.
sweeping_period: 1.2
accel_chip_x: adxl345 rpi
accel_chip_y: adxl345
# The bed resonates at a low amplitude, this will make SHAPER_CALIBRATE aim better,
# while still being ringing free.
max_smoothing: 0.08 
probe_points:
    90,90,20 # Override this in printer.cfg to be the center of your bed.
